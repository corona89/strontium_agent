<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Strontium Agent</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100vh;
      background: #0f172a; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      user-select: none; overflow: hidden;
    }
    .logo {
      font-size: 20px; font-weight: 600; letter-spacing: -0.01em;
      margin-bottom: 28px; opacity: 0.92;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid rgba(148, 163, 184, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    .msg {
      margin-top: 18px; font-size: 12px; color: #94a3b8;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">Strontium Agent</div>
  <div class="spinner"></div>
  <div class="msg">서버를 시작하는 중…</div>
</body>
</html>
